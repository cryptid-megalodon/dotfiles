# Tmux config
#
# Custom bindings carry -N notes, so prefix + ? lists them alongside the
# defaults. Cheat sheet: README.md in the chezmoi source (chezmoi cd).

# Note: To reload config after changes, use $ tmux source-file ~/.tmux.conf
# instead of traditional sourcing.

# C-b is the prefix; C-Space works as a second prefix.
set-option -g prefix C-b
set-option -g prefix2 C-Space
bind -N "Send C-Space to the pane" C-Space send-prefix -2

# Set mode to vi keys
set-window-option -g mode-keys vi

# split panes using | or \ (side by side) and - or _ (top/bottom),
# plus the defaults % and ". New panes and windows open in the current dir.
bind -N "Split side by side (current dir)" | split-window -h -c "#{pane_current_path}"
bind -N "Split side by side (current dir)" \\ split-window -h -c "#{pane_current_path}"
bind -N "Split side by side (current dir)" % split-window -h -c "#{pane_current_path}"
bind -N "Split top/bottom (current dir)" - split-window -v -c "#{pane_current_path}"
bind -N "Split top/bottom (current dir)" _ split-window -v -c "#{pane_current_path}"
bind -N "Split top/bottom (current dir)" '"' split-window -v -c "#{pane_current_path}"
bind -N "New window (current dir)" c new-window -c "#{pane_current_path}"

# Switch panes using prefix + vi nav
bind -N "Select pane left" h select-pane -L
bind -N "Select pane right" l select-pane -R
bind -N "Select pane down" j select-pane -D
bind -N "Select pane up" k select-pane -U

# Switch panes (and nvim splits) using C-h/j/k/l without prefix.
# Pairs with christoomey/vim-tmux-navigator in nvim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -N "(no prefix needed) Pane/nvim split left" -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -N "(no prefix needed) Pane/nvim split down" -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -N "(no prefix needed) Pane/nvim split up" -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -N "(no prefix needed) Pane/nvim split right" -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -Tcopy-mode-vi C-h select-pane -L
bind -Tcopy-mode-vi C-j select-pane -D
bind -Tcopy-mode-vi C-k select-pane -U
bind -Tcopy-mode-vi C-l select-pane -R

# C-l and C-k are taken above; prefix + C-l clears the screen, prefix + C-k
# kills to end of line.
bind -N "Send C-l (clear screen)" C-l send-keys C-l
bind -N "Send C-k (kill to end of line)" C-k send-keys C-k

# Resize panes with prefix + H/J/K/L (repeatable), and rebalance with =
bind -N "Resize pane left (repeatable)" -r H resize-pane -L 5
bind -N "Resize pane down (repeatable)" -r J resize-pane -D 5
bind -N "Resize pane up (repeatable)" -r K resize-pane -U 5
bind -N "Resize pane right (repeatable)" -r L resize-pane -R 5
bind -N "Balance the current pane and its neighbors" = select-layout -E

# Reload config file (change file location to your the tmux.conf you want to use)
bind -N "Reload ~/.tmux.conf" R source-file ~/.tmux.conf

# Unset escape key for switching panes
set -s escape-time 0

# Set the terminal when using tmux
set -g default-terminal tmux-256color

# Mouse support: click to focus, drag borders to resize, scroll
set -g mouse on

# Number windows and panes from 1, and close gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000

# Let copies reach the system clipboard (via OSC 52 in the terminal)
set -g set-clipboard on

# Copy pasting from terminal - need to enter 'copy mode' first - '<prefix> ['
unbind p
bind -N "Paste the most recent buffer" p paste-buffer
bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-selection-and-cancel
