# Single source of truth for what gets installed.
# Edited here -> `chezmoi apply` reruns the package script (run_onchange).
packages:
  # Homebrew (macOS). Formulae are CLI tools, casks are GUI apps.
  brew:
    formulae:
      - git
      - zsh
      - tmux
      - neovim
      - starship
      - ripgrep
      - fd
      - fzf
      - jq
      - node
      - go
      - gh
    casks:
      - ghostty
      - visual-studio-code
    # Personal machines only; on work machines these apps are managed outside brew.
    casks_personal:
      - firefox
      - bitwarden

  # Linux (Debian/Ubuntu).
  apt:
    - build-essential
    - git
    - curl
    - zsh
    - tmux
    - neovim
    - ripgrep
    - fd-find
    - fzf
    - jq
    - zlib1g-dev
    - vlc
    - deluge
    - gh            # from the github-cli repo below, never the snap
  # Third-party apt repos, set up before `apt-get install`. Pinned above
  # Ubuntu Pro ESM so the upstream build wins.
  apt_repos:
    - name: github-cli
      key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      uri: https://cli.github.com/packages
      suite: stable
      components: main
      pin_origin: cli.github.com
  snap:
    - name: code
      classic: true
    - name: ghostty
      classic: true
    - name: firefox

  # Installed via `code --install-extension`.
  vscode_extensions:
    - anthropic.claude-code
    - charliermarsh.ruff
    - dnut.rewrap-revived
    - docker.docker
    - dracula-theme.theme-dracula
    - golang.go
    - ms-azuretools.vscode-containers
    - ms-python.debugpy
    - ms-python.python
    - ms-python.vscode-pylance
    - ms-toolsai.jupyter
    - ms-vscode-remote.remote-containers
    - redhat.vscode-yaml
    - vscodevim.vim
